<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <rect width="600" height="800" fill="#0a0a0f"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="133" x2="600" y2="133"/>
    <line x1="0" y1="266" x2="600" y2="266"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="533" x2="600" y2="533"/>
    <line x1="0" y1="666" x2="600" y2="666"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
  </g>

  <!-- Ambient glow blobs -->
  <ellipse cx="480" cy="200" rx="220" ry="180" fill="#C8203E" fill-opacity="0.08"/>
  <ellipse cx="120" cy="620" rx="180" ry="160" fill="#3b5bdb" fill-opacity="0.07"/>

  <!-- Monitor frame -->
  <rect x="80" y="100" width="440" height="290" rx="14" fill="#111118" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect x="96" y="116" width="408" height="258" rx="6" fill="#0d0d14"/>
  <!-- Monitor stand -->
  <rect x="268" y="390" width="64" height="40" rx="4" fill="#111118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="220" y="428" width="160" height="8" rx="4" fill="#111118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Screen content: candlestick chart area -->
  <!-- Y-axis labels -->
  <text x="104" y="148" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">52,400</text>
  <text x="104" y="196" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">51,800</text>
  <text x="104" y="244" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">51,200</text>
  <text x="104" y="292" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">50,600</text>
  <text x="104" y="340" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">50,000</text>

  <!-- Chart grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="152" y1="142" x2="490" y2="142"/>
    <line x1="152" y1="190" x2="490" y2="190"/>
    <line x1="152" y1="238" x2="490" y2="238"/>
    <line x1="152" y1="286" x2="490" y2="286"/>
    <line x1="152" y1="334" x2="490" y2="334"/>
  </g>

  <!-- Line chart path (price movement) -->
  <polyline points="152,290 192,270 232,295 272,240 312,218 352,235 392,200 432,215 472,185" stroke="#C8203E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area fill under chart -->
  <polygon points="152,290 192,270 232,295 272,240 312,218 352,235 392,200 432,215 472,185 472,360 152,360" fill="url(#chartGrad)" opacity="0.4"/>

  <!-- Candlesticks -->
  <!-- Candle 1 (green) -->
  <line x1="172" y1="265" x2="172" y2="310" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="165" y="275" width="14" height="24" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <!-- Candle 2 (red) -->
  <line x1="212" y1="260" x2="212" y2="305" stroke="#C8203E" stroke-width="1.5"/>
  <rect x="205" y="270" width="14" height="22" rx="2" fill="#C8203E" fill-opacity="0.9"/>
  <!-- Candle 3 (green) -->
  <line x1="252" y1="232" x2="252" y2="275" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="245" y="242" width="14" height="20" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <!-- Candle 4 (green) -->
  <line x1="292" y1="210" x2="292" y2="255" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="285" y="218" width="14" height="22" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <!-- Candle 5 (red) -->
  <line x1="332" y1="222" x2="332" y2="268" stroke="#C8203E" stroke-width="1.5"/>
  <rect x="325" y="228" width="14" height="24" rx="2" fill="#C8203E" fill-opacity="0.9"/>
  <!-- Candle 6 (green) -->
  <line x1="372" y1="188" x2="372" y2="232" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="365" y="196" width="14" height="20" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <!-- Candle 7 (green) -->
  <line x1="412" y1="200" x2="412" y2="245" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="405" y="208" width="14" height="18" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <!-- Candle 8 (green) -->
  <line x1="452" y1="170" x2="452" y2="214" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="445" y="178" width="14" height="20" rx="2" fill="#22c55e" fill-opacity="0.9"/>

  <!-- Chart gradient def -->
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8203E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C8203E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ticker label top right of screen -->
  <rect x="400" y="122" width="88" height="22" rx="4" fill="#C8203E" fill-opacity="0.15"/>
  <text x="408" y="137" font-family="monospace" font-size="10" fill="#C8203E" font-weight="bold">NIFTY 50</text>
  <text x="408" y="154" font-family="monospace" font-size="8" fill="#22c55e">▲ 1.24%</text>

  <!-- Volume bars at bottom of screen -->
  <g opacity="0.5">
    <rect x="159" y="345" width="10" height="12" rx="1" fill="#22c55e"/>
    <rect x="199" y="340" width="10" height="17" rx="1" fill="#C8203E"/>
    <rect x="239" y="343" width="10" height="14" rx="1" fill="#22c55e"/>
    <rect x="279" y="338" width="10" height="19" rx="1" fill="#22c55e"/>
    <rect x="319" y="342" width="10" height="15" rx="1" fill="#C8203E"/>
    <rect x="359" y="336" width="10" height="21" rx="1" fill="#22c55e"/>
    <rect x="399" y="340" width="10" height="17" rx="1" fill="#22c55e"/>
    <rect x="439" y="334" width="10" height="23" rx="1" fill="#22c55e"/>
  </g>

  <!-- Stats row below monitor -->
  <rect x="80" y="460" width="132" height="80" rx="10" fill="#111118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="96" y="490" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">MODULES</text>
  <text x="96" y="518" font-family="Georgia, serif" font-size="28" fill="#ffffff" font-weight="bold">24+</text>

  <rect x="234" y="460" width="132" height="80" rx="10" fill="#111118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="250" y="490" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">TOPICS</text>
  <text x="250" y="518" font-family="Georgia, serif" font-size="28" fill="#C8203E" font-weight="bold">120+</text>

  <rect x="388" y="460" width="132" height="80" rx="10" fill="#111118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="404" y="490" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">FREE ACCESS</text>
  <text x="404" y="518" font-family="Georgia, serif" font-size="28" fill="#22c55e" font-weight="bold">100%</text>

  <!-- Book stack illustration -->
  <rect x="80" y="574" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <rect x="88" y="556" width="164" height="22" rx="4" fill="#1d4ed8" fill-opacity="0.7"/>
  <rect x="80" y="538" width="180" height="22" rx="4" fill="#C8203E" fill-opacity="0.6"/>
  <!-- Book spines text -->
  <text x="96" y="552" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.5">EQUITY MARKETS</text>
  <text x="104" y="571" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.5">MUTUAL FUNDS</text>
  <text x="96" y="590" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.5">DEBT &amp; BONDS</text>

  <!-- Pie/donut chart -->
  <circle cx="450" cy="580" r="70" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" fill="none"/>
  <!-- Donut segments -->
  <circle cx="450" cy="580" r="50" fill="none" stroke="#C8203E" stroke-width="20" stroke-dasharray="94 220" stroke-dashoffset="0" transform="rotate(-90 450 580)"/>
  <circle cx="450" cy="580" r="50" fill="none" stroke="#1d4ed8" stroke-width="20" stroke-dasharray="72 220" stroke-dashoffset="-94" transform="rotate(-90 450 580)"/>
  <circle cx="450" cy="580" r="50" fill="none" stroke="#22c55e" stroke-width="20" stroke-dasharray="54 220" stroke-dashoffset="-166" transform="rotate(-90 450 580)"/>
  <!-- Donut center label -->
  <text x="450" y="576" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">PORTFOLIO</text>
  <text x="450" y="590" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">MIX</text>

  <!-- Legend dots -->
  <circle cx="320" cy="668" r="5" fill="#C8203E"/>
  <text x="330" y="673" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.5">Equity 43%</text>
  <circle cx="320" cy="688" r="5" fill="#1d4ed8"/>
  <text x="330" y="693" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.5">Debt 33%</text>
  <circle cx="320" cy="708" r="5" fill="#22c55e"/>
  <text x="330" y="713" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.5">Liquid 24%</text>

  <!-- Decorative quote at bottom -->
  <line x1="80" y1="746" x2="520" y2="746" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <text x="300" y="770" font-family="Georgia, serif" font-size="13" fill="#ffffff" fill-opacity="0.2" text-anchor="middle" font-style="italic">Knowledge Creates Wealth</text>

  <!-- Top accent hairline -->
  <line x1="80" y1="100" x2="520" y2="100" stroke="#C8203E" stroke-opacity="0.3" stroke-width="1"/>
</svg>
